[package]
name = "hdjlabs"
version = "1.0.0"
edition = "2021"
authors = ["OPH <https://github.com/op-h>"]
description = "HDJLabs — build secure offline exams and run them as locked-down Windows apps over the classroom LAN"
license = "MIT"
repository = "https://github.com/op-h/HDJLabs"
build = "build.rs"

[[bin]]
name = "HDJLabs"
path = "src/main.rs"

[dependencies]
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.32", default-features = false, features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
if-addrs = "0.13"
dirs = "6"
rfd = "0.15"
rustpython = { version = "0.4", default-features = false, features = ["stdlib", "freeze-stdlib"] }
rustpython-vm = "0.4"
boa_engine = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
